<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SallyIP for Word</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 12px; color: #1a1a1a; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p.hint { font-size: 12px; color: #555; }
    label { display: block; font-size: 12px; margin: 8px 0 4px; }
    input, select, textarea { width: 100%; font-size: 13px; padding: 6px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
    #status { font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
    #result { font-size: 12px; margin-top: 8px; white-space: pre-wrap; border-top: 1px solid #ddd; padding-top: 8px; }
  </style>
</head>
<body>
  <h1>SallyIP for Word</h1>
  <p class="hint">Run a Sally playbook against the open document, then insert the result. Sign in to SallyIP in your browser first (uses session cookie).</p>
  <label>API base<input id="apiBase" value="" placeholder="https://your-app.vercel.app (blank = same origin)" /></label>
  <label>Playbook<select id="playbook"></select></label>
  <label>Variables (JSON)<textarea id="variables" rows="3" placeholder='{"product":"Product X"}'></textarea></label>
  <label>Matter ID<input id="matterId" placeholder="matter uuid" /></label>
  <div>
    <button id="refresh">Refresh playbooks</button>
    <button id="run">Run playbook</button>
    <button id="insert">Insert result into document</button>
  </div>
  <div id="status">Loading…</div>
  <div id="result"></div>
  <script src="./taskpane.js"></script>
</body>
</html>
