name: Secret Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run secret scan
        run: node scripts/secret-scan.mjs
      - name: Run pre-commit secret scan on changed files
        run: |
          git diff --name-only HEAD~1...HEAD | xargs -r node scripts/secret-scan.mjs --files
        continue-on-error: false