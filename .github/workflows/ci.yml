name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run secret:scan
      - run: npm run test:foundation
      - run: npm run test:security
  visual:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test tests/visual-regression.spec.ts --project=${{ matrix.browser }} --reporter=html,junit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-report-${{ matrix.browser }}
          path: |
            test-results/visual-report
            test-results/**/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-traces-${{ matrix.browser }}
          path: test-results/**/trace.zip
          retention-days: 14
  release-gate:
    runs-on: ubuntu-latest
    needs: [quality, visual]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "All gates passed"
